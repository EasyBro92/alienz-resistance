<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>Guerra civil · AlienZ Resistance</title>
</head>
<body>
  <!-- La Guerra civil va en su propia página: nada de lo que pasa aquí toca la
       campaña, ni su estado ni sus pantallas. -->
  <canvas id="gc-lienzo"></canvas>

  <!-- Menú del modo -->
  <div id="gc-menu" class="gc-capa">
    <div class="gc-caja">
      <p class="gc-antetitulo">Multijugador</p>
      <h1>GUERRA CIVIL</h1>
      <p class="gc-texto">Sin alienz. Dos compañías, una carretera en medio y una base en cada punta. Manda soldados, ponles defensas y entra en la base del otro.</p>
      <!-- Tu compañía: nombre y emblema, elegidos aquí y guardados en el
           móvil. Salen en el marcador, en el final y en tus banderas. -->
      <div class="gc-compania">
        <button id="gc-escudo" class="gc-escudo" type="button" aria-label="Elegir emblema" aria-expanded="false"></button>
        <label class="gc-compania-nombre">
          <span>Tu compañía</span>
          <input id="gc-nombre" type="text" maxlength="20" autocomplete="off" spellcheck="false" placeholder="Ponle nombre">
        </label>
      </div>
      <div id="gc-iconos" class="gc-iconos" hidden role="listbox" aria-label="Emblemas"></div>
      <button id="gc-maquina" class="gc-boton gc-principal" type="button">CONTRA LA MÁQUINA <small>práctica</small></button>
      <button class="gc-boton" type="button" disabled>MAPA DEL MUNDO <small>próximamente</small></button>
      <!-- En directo contra otra persona (28/09), en el mismo pueblo que contra
           la máquina hasta que haya mapa del mundo. -->
      <button id="gc-rapida" class="gc-boton gc-directo" type="button">EMPAREJAMIENTO RÁPIDO <small>contra quien esté buscando ahora</small></button>
      <button id="gc-codigo" class="gc-boton gc-directo" type="button">JUGAR CON CÓDIGO <small>abre una sala o entra en la de un amigo</small></button>
      <div id="gc-sala" class="gc-sala" hidden>
        <button id="gc-crear" class="gc-boton" type="button">CREAR SALA</button>
        <div class="gc-unirse">
          <input id="gc-codigo-campo" type="text" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CÓDIGO" aria-label="Código de la sala">
          <button id="gc-entrar" class="gc-boton" type="button">ENTRAR</button>
        </div>
      </div>
      <p id="gc-aviso" class="gc-aviso" aria-live="polite"></p>
      <a class="gc-boton gc-volver" href="./">VOLVER</a>
    </div>
  </div>

  <!-- Marcador de la partida. Isidro: «el menú de abajo tapa la partida».
       Arriba lo que se mira (vidas, monedas, reloj), abajo UNA tira de cartas
       que se desliza de lado como la armería de la campaña, y las órdenes en
       un lateral. -->
  <div id="gc-hud" hidden>
    <div class="gc-arriba">
      <button id="gc-salir" class="gc-mini" type="button" aria-label="Salir">✕</button>
      <div class="gc-vidas">
        <div class="gc-vida gc-rojo"><span id="gc-nombre-rival">Máquina</span><div class="gc-barra"><i id="gc-vida-rojo"></i></div></div>
        <div class="gc-vida gc-azul"><span id="gc-nombre-mio">Tu base</span><div class="gc-barra"><i id="gc-vida-azul"></i></div></div>
      </div>
      <div class="gc-lado">
        <b id="gc-reloj" class="gc-reloj">5:00</b>
        <b id="gc-monedas" class="gc-monedas">0</b>
      </div>
    </div>
    <p id="gc-pista" class="gc-pista"></p>
    <div class="gc-ordenes">
      <button id="gc-modo" class="gc-orden" type="button" aria-label="Qué hacen al salir"><b>SOLTAR</b><small>avanzan solos</small></button>
      <button id="gc-chat-boton" class="gc-orden" type="button" hidden><b>💬 CHAT</b><small id="gc-chat-nuevo"></small></button>
      <button id="gc-avanzar" class="gc-orden gc-avanzar" type="button"><b>¡AL ATAQUE!</b><small id="gc-quietos">nadie esperando</small></button>
    </div>
    <div id="gc-chat" class="gc-chat" hidden>
      <ul id="gc-mensajes" class="gc-mensajes"></ul>
      <div id="gc-frases" class="gc-frases"></div>
      <form id="gc-escribir-form" class="gc-escribir">
        <input id="gc-escribir" type="text" maxlength="60" autocomplete="off" placeholder="Escribe algo…" aria-label="Mensaje">
        <button type="submit">Enviar</button>
      </form>
    </div>
    <div class="gc-tira">
      <div id="gc-cartas" class="gc-cartas"></div>
    </div>
  </div>

  <!-- Final -->
  <div id="gc-final" class="gc-capa" hidden>
    <div class="gc-caja">
      <h1 id="gc-final-titulo">VICTORIA</h1>
      <p id="gc-final-texto" class="gc-texto"></p>
      <button id="gc-otra" class="gc-boton gc-principal" type="button">OTRA PARTIDA</button>
      <button id="gc-menu-otra" class="gc-boton" type="button">MENÚ DE GUERRA CIVIL</button>
      <a class="gc-boton gc-volver" href="./">VOLVER AL JUEGO</a>
    </div>
  </div>

  <!-- Buscando rival o esperando a que entre en tu sala. -->
  <div id="gc-espera" class="gc-capa" hidden>
    <div class="gc-caja">
      <div class="gc-radar" aria-hidden="true"><i></i></div>
      <p id="gc-espera-texto" class="gc-texto"></p>
      <b id="gc-espera-codigo" class="gc-espera-codigo" hidden></b>
      <button id="gc-cancelar" class="gc-boton gc-volver" type="button">CANCELAR</button>
    </div>
  </div>

  <div id="gc-carga" class="gc-capa" hidden><p class="gc-texto">Preparando las compañías…</p></div>

  <script type="module" src="/src/guerra/main.js"></script>
</body>
</html>
